name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-m1.lock.txt
      - run: python -m pip install -r requirements-m1.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q

  frontend:
    name: Dashboard tests and build
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run build
